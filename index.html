<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Page</title>
    <style>
        .first_container{
            display: flex;
            justify-content: center;
        }
        .container-01{
            width: 25vw;
            height: 40vh;
            margin: 3px;
            padding: 2px;
            border: 2px black solid;
            background-color: aqua;
            color: brown;
            text-align: center;
            position: relative;
            top: 200px;
        }
    </style>
</head>
<body>
    <div class="first_container">
        <div class="container-01">
            <form action="join_donor_finder.html">
                <h1>Welcome to the Blood Group Page</h1>
                <label for="name">Name:</label>
                <input type="text" placeholder="Enter the name" id="name"required>
                <br><br>
                <label for="email">Email ID:</label>
                <input type="text" placeholder="Enter your Email ID" id="email"required>
                <br><br>
                <button type="submit">Login</button>
                
            </form>
        </div>
    </div>
    
</body>
</html>
